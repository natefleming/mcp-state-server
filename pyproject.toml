[project]
name = "mcp-state-server"
version = "0.1.0"
description = "MCP server for conversation and preference persistence using Databricks Lakehouse Postgres"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.73.0",
    "fastapi>=0.115.12",
    "fastmcp>=2.13.0.2",
    "langchain>=1.0.5",
    "langchain-mcp-adapters>=0.1.12",
    "langgraph>=1.0.3",
    "mcp[cli]>=1.21.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.5.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.34.2",
    "uv>=0.9.8",
]

[project.scripts]
mcp-state-server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "mcp_state_server"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
]
